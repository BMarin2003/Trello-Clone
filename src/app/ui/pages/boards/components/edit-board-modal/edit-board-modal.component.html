<div
  class="overlay fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity"
  (click)="onOverlayClick($event)"
>
  <div
    class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden animate-fade-in-up max-h-[90vh] overflow-y-auto"
  >
    <div
      class="px-6 py-4 border-b border-gray-100 flex justify-between items-center sticky top-0 bg-white z-10"
    >
      <h3 class="text-lg font-bold text-gray-800">Editar Tablero</h3>
      <button
        (click)="close.emit()"
        class="text-gray-400 hover:text-gray-600 transition-colors cursor-pointer"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <form
      *ngIf="form"
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="p-6 space-y-6"
    >
      <div class="space-y-2">
        <label for="boardTitle" class="block text-sm font-medium text-gray-700"
          >Título del tablero</label
        >
        <input
          id="boardTitle"
          type="text"
          formControlName="title"
          name="boardTitle"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
        />
      </div>

      <div class="space-y-3">
        <span class="block text-sm font-medium text-gray-700"
          >Color de fondo</span
        >
        <div class="flex gap-3 flex-wrap">
          @for (color of colors; track color) {
          <button
            type="button"
            (click)="form.get('backgroundColor')?.setValue(color)"
            [class]="colorMap[color]"
            [title]="color"
            class="w-8 h-8 rounded-full cursor-pointer transition-transform hover:scale-110 relative flex items-center justify-center"
          >
            @if (form.get('backgroundColor')?.value === color) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5 text-white"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                clip-rule="evenodd"
              />
            </svg>
            }
          </button>
          }
        </div>
      </div>

      <!-- Project Field -->
      <div class="space-y-2">
        <label for="projectName" class="block text-sm font-medium text-gray-700"
          >Proyecto</label
        >
        <input
          id="projectName"
          type="text"
          formControlName="projectName"
          name="projectName"
          placeholder="Nombre del proyecto"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
        />
      </div>

      <!-- Responsibles Field -->
      <div class="space-y-2">
        <span class="block text-sm font-medium text-gray-700"
          >Responsables</span
        >
        <div
          class="flex flex-wrap gap-2 max-h-32 overflow-y-auto border border-gray-200 p-2 rounded-lg"
        >
          @for(user of users; track user.id) {
          <button
            type="button"
            (click)="toggleSelection('responsibles', user.id)"
            [class.bg-indigo-100]="isSelected('responsibles', user.id)"
            [class.text-indigo-700]="isSelected('responsibles', user.id)"
            [class.border-indigo-300]="isSelected('responsibles', user.id)"
            class="flex items-center gap-2 px-2 py-1 bg-white border border-gray-200 rounded-full text-xs hover:bg-gray-50 transition-colors"
          >
            <img
              [src]="user.avatar"
              class="w-4 h-4 rounded-full"
              alt="avatar"
            />
            <span>{{ user.name }}</span>
          </button>
          }
        </div>
      </div>

      <!-- Members Field -->
      <div class="space-y-2">
        <span class="block text-sm font-medium text-gray-700">Miembros</span>
        <div
          class="flex flex-wrap gap-2 max-h-32 overflow-y-auto border border-gray-200 p-2 rounded-lg"
        >
          @for(user of users; track user.id) {
          <button
            type="button"
            (click)="toggleSelection('memberIds', user.id)"
            [class.bg-indigo-100]="isSelected('memberIds', user.id)"
            [class.text-indigo-700]="isSelected('memberIds', user.id)"
            [class.border-indigo-300]="isSelected('memberIds', user.id)"
            class="flex items-center gap-2 px-2 py-1 bg-white border border-gray-200 rounded-full text-xs hover:bg-gray-50 transition-colors"
          >
            <img
              [src]="user.avatar"
              class="w-4 h-4 rounded-full"
              alt="avatar"
            />
            <span>{{ user.name }}</span>
          </button>
          }
        </div>
      </div>

      <!-- Groups Field -->
      <div class="space-y-2">
        <span class="block text-sm font-medium text-gray-700">Grupos</span>
        <div
          class="flex flex-wrap gap-2 max-h-32 overflow-y-auto border border-gray-200 p-2 rounded-lg"
        >
          @for(group of groups; track group.id) {
          <button
            type="button"
            (click)="toggleSelection('memberGroupIds', group.id)"
            [class.bg-indigo-100]="isSelected('memberGroupIds', group.id)"
            [class.text-indigo-700]="isSelected('memberGroupIds', group.id)"
            [class.border-indigo-300]="isSelected('memberGroupIds', group.id)"
            class="flex items-center gap-2 px-2 py-1 bg-white border border-gray-200 rounded-full text-xs hover:bg-gray-50 transition-colors"
          >
            <span class="w-2 h-2 rounded-full" [class]="group.color"></span>
            <span>{{ group.name }}</span>
          </button>
          }
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-2 sticky bottom-0 bg-white pb-2">
        <button
          type="button"
          (click)="close.emit()"
          class="px-4 py-2 text-gray-700 font-medium hover:bg-gray-100 rounded-lg transition-colors cursor-pointer"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="form.invalid"
          class="px-4 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm cursor-pointer"
        >
          Guardar Cambios
        </button>
      </div>
    </form>
  </div>
</div>
