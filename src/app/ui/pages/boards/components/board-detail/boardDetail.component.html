@if (board()) {
  <div class="h-full w-full flex flex-col transition-colors duration-500 ease-in-out" [ngClass]="getBackgroundClass()">

    <header class="bg-black/20 backdrop-blur-md border-b border-white/10 px-6 py-3 flex flex-col gap-2 shrink-0">

      <nav class="flex items-center text-xs font-medium text-white/80 space-x-2">
        <a
          routerLink="/boards"
          class="hover:text-white hover:bg-white/20 px-2 py-0.5 rounded transition-all duration-200 flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
          </svg>
          Tableros
        </a>
        <span class="opacity-50">/</span>
        <span class="text-white cursor-default truncate max-w-[200px]">{{ board()?.title }}</span>
      </nav>

      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">

        <div class="flex items-center gap-3">
          @if (isEditingTitle()) {
            <input
              id="titleInput"
              [formControl]="titleControl"
              (blur)="saveTitle()"
              (keydown.enter)="saveTitle()"
              (keydown.escape)="cancelEdit()"
              class="text-2xl font-bold text-gray-800 bg-white px-2 py-0.5 rounded shadow-sm outline-none border-2 border-indigo-500 w-auto min-w-[200px]"
            />
          } @else {
            <h1
              (click)="editTitle()"
              class="text-2xl font-bold text-white tracking-tight drop-shadow-sm cursor-pointer hover:bg-white/20 px-2 py-0.5 -ml-2 rounded transition-colors border-2 border-transparent">
              {{ board()?.title }}
            </h1>
          }

          <button class="text-white/50 hover:text-yellow-400 transition-colors p-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
            </svg>
          </button>
        </div>

        <div class="flex items-center gap-3">

          <div class="flex -space-x-2 overflow-hidden">
            <div class="inline-block h-8 w-8 rounded-full ring-2 ring-white/30 bg-indigo-500 items-center justify-center text-xs text-white font-bold cursor-pointer" title="Usuario Principal">Yo</div>
            <div class="inline-block h-8 w-8 rounded-full ring-2 ring-white/30 bg-pink-500 items-center justify-center text-xs text-white font-bold cursor-pointer opacity-75">JS</div>
            <button class="h-8 w-8 rounded-full ring-2 ring-white/30 bg-white/20 hover:bg-white/30 flex items-center justify-center text-white transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
              </svg>
            </button>
          </div>

          <div class="h-6 w-px bg-white/20 mx-1"></div>

          <button class="flex items-center gap-2 px-3 py-1.5 bg-white/20 hover:bg-white/30 text-white text-sm font-medium rounded transition-colors backdrop-blur-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
            </svg>
            <span class="hidden sm:inline">Filtrar</span>
          </button>

          <div class="relative">

            <button
              (click)="toggleMenu()"
              class="flex items-center gap-2 px-3 py-1.5 bg-white/20 hover:bg-white/30 text-white text-sm font-medium rounded transition-colors backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-white/50">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
              </svg>
              <span class="hidden sm:inline">Personalizar</span>
            </button>

            @if (isMenuOpen()) {
              <div class="fixed inset-0 z-10" (click)="toggleMenu()"></div>

              <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl z-20 py-2 animate-fade-in-up border border-gray-100">
                <div class="px-4 py-2 border-b border-gray-100">
                  <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Cambiar Fondo</span>
                </div>

                <div class="p-3 grid grid-cols-5 gap-2">
                  @for (color of colors; track color) {
                    <button
                      (click)="updateBackgroundColor(color)"
                      [class]="menuColorMap[color]"
                      class="w-6 h-6 rounded-full hover:scale-110 transition-transform cursor-pointer ring-2 ring-offset-2 ring-transparent hover:ring-gray-300 relative flex items-center justify-center">

                      @if (board()?.backgroundColor === color) {
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-white drop-shadow-md" viewBox="0 0 20 20" fill="currentColor">
                          <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                        </svg>
                      }
                    </button>
                  }
                </div>
              </div>
            }
          </div>

        </div>
      </div>
    </header>

    <div class="flex-1 overflow-x-auto overflow-y-hidden">
      <div class="h-full px-6 py-4 flex items-start gap-4 min-w-max">

        <div class="w-72 bg-[#F1F2F4] rounded-xl shadow-lg flex flex-col max-h-full opacity-80 border border-white/40">
          <div class="p-3 font-semibold text-gray-700 text-sm pl-4">Por hacer</div>
          <div class="flex-1 p-2"></div> <div class="p-3">
          <button class="flex items-center gap-2 text-gray-500 hover:bg-gray-200 w-full p-2 rounded-lg text-sm transition-colors text-left">
            <span>+</span> Añadir una tarjeta
          </button>
        </div>
        </div>

        <div class="w-72 shrink-0">
          <button class="w-full bg-white/20 hover:bg-white/30 backdrop-blur-sm text-white font-medium py-3 rounded-xl flex items-center justify-start px-4 gap-2 transition-all text-sm border border-white/10 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            Añadir otra lista
          </button>
        </div>

      </div>
    </div>
  </div>

} @else {
  <div class="h-full w-full flex flex-col items-center justify-center bg-gray-50">
    <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
    <p class="text-gray-500 font-medium animate-pulse">Cargando tablero...</p>
  </div>
}
