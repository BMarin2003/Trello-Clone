<div class="w-full h-dvh flex flex-col relative" [class]="getBackgroundClass()">
  <header
    class="h-12 w-full flex items-center justify-between px-4 bg-[#171a21] text-white shrink-0 z-30"
  >
    <a
      routerLink="/boards"
      class="flex items-center gap-2.5 hover:opacity-80 transition-opacity cursor-pointer"
    >
      <div
        class="w-7 h-7 bg-gradient-to-br from-violet-500 to-purple-600 rounded-lg flex items-center justify-center text-white font-bold text-xs shadow-md"
      >
        T
      </div>
      <span class="font-semibold text-sm text-gray-100">TrelloClone</span>
    </a>

    <div
      class="w-8 h-8 rounded-full bg-gradient-to-br from-violet-500 to-purple-600 flex items-center justify-center text-white font-bold text-xs shadow-md cursor-pointer hover:shadow-lg transition-shadow"
    >
      U
    </div>
  </header>

  <div
    class="h-12 w-full flex items-center justify-between px-4 bg-black/20 backdrop-blur-sm text-white shrink-0 z-20"
  >
    <div class="flex items-center gap-3">
      @if (isEditingTitle()) {
      <input
        id="titleInput"
        [formControl]="titleControl"
        (blur)="saveTitle()"
        (keydown.enter)="saveTitle()"
        (keydown.escape)="cancelEdit()"
        class="px-3 py-1.5 text-base font-semibold text-gray-800 bg-white rounded-lg shadow-inner outline-none focus:ring-2 focus:ring-blue-500 w-64"
      />
      } @else {
      <h1
        (click)="editTitle()"
        class="px-3 py-1.5 text-base font-semibold rounded-lg hover:bg-white/20 cursor-pointer transition-colors duration-200 select-none truncate max-w-md"
      >
        {{ board()?.title }}
      </h1>
      }
    </div>

    <button
      (click)="toggleMenu()"
      class="flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-white/20 transition-colors duration-200 text-sm font-medium cursor-pointer"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-5 h-5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM12.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM18.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"
        />
      </svg>
      Menú
    </button>
  </div>

  <main class="flex-1 overflow-x-auto overflow-y-hidden p-4 relative z-10">
    <div
      cdkDropList
      cdkDropListGroup
      cdkDropListOrientation="horizontal"
      [cdkDropListData]="columns()"
      (cdkDropListDropped)="drop($event)"
      class="flex items-start gap-4 h-full"
    >
      @for (col of columns(); track col.id) {
      <div cdkDrag class="h-full cursor-default">
        <app-board-column
          class="h-full block"
          [column]="col"
          [boardColor]="board()?.backgroundColor || 'sky'"
          (onDelete)="requestDeleteColumn($event)"
        ></app-board-column>
        <div
          *cdkDragPlaceholder
          class="w-72 h-full bg-gray-200/50 rounded-xl border border-dashed border-gray-400"
        ></div>
      </div>
      }

      <div class="w-72 shrink-0">
        @if (isCreatingColumn()) {
        <div
          class="bg-[#12141a] rounded-xl p-3 shadow-lg border border-gray-700/50 animate-in fade-in duration-200"
        >
          <input
            id="newColumnInput"
            [formControl]="newColumnControl"
            (keydown.enter)="saveColumn()"
            (keydown.escape)="cancelAddColumn()"
            placeholder="Introduce el título de la lista..."
            class="w-full px-3 py-2 rounded-lg border-2 bg-gray-900 text-gray-100 placeholder-gray-400 focus:outline-none text-sm mb-2"
            [ngClass]="getInputBorderClass()"
          />
          <div class="flex items-center gap-2">
            <button (click)="saveColumn()" [ngClass]="getButtonClass()">
              Añadir lista
            </button>
            <button
              (click)="cancelAddColumn()"
              class="text-gray-500 hover:text-gray-700 hover:bg-gray-200 p-1.5 rounded-lg cursor-pointer transition-colors"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                class="w-5 h-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M6 18L18 6M6 6l12 12"
                />
              </svg>
            </button>
          </div>
        </div>
        } @else {
        <button
          (click)="enableAddColumn()"
          class="w-full bg-white/20 hover:bg-white/30 text-white font-medium p-3 rounded-xl flex items-center gap-2 transition-all backdrop-blur-sm border border-white/10 shadow-sm text-left cursor-pointer"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-5 h-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 4.5v15m7.5-7.5h-15"
            />
          </svg>
          {{
            columns().length === 0
              ? "Añade tu primera lista"
              : "Añadir otra lista"
          }}
        </button>
        }
      </div>
    </div>
  </main>

  @if (isMenuOpen()) {
  <div
    class="fixed inset-0 z-40 bg-transparent cursor-default"
    (click)="toggleMenu()"
  ></div>

  <div
    class="absolute top-16 right-4 w-72 bg-[#12141a] rounded-lg shadow-2xl py-2 text-gray-200 animate-in fade-in zoom-in-95 duration-200 border border-gray-700 z-50 cursor-default"
  >
    <div
      class="px-4 py-3 border-b border-gray-700 flex items-center justify-between mb-2"
    >
      <span class="font-semibold text-center flex-1">Menú</span>
      <button
        (click)="toggleMenu()"
        class="text-gray-400 hover:text-gray-200 p-1 rounded-full hover:bg-white/10"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-4 h-4"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <div class="px-4 py-2">
      <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">
        Fondo
      </h3>
      <div class="grid grid-cols-5 gap-2">
        @for (color of colors; track color) {
        <button
          (click)="updateBackgroundColor(color)"
          [class]="menuColorMap[color]"
          class="w-8 h-8 cursor-pointer rounded-md transition-all duration-300 transform hover:scale-110"
          [ngClass]="shadowColorMap[color]"
          [class.ring-2]="board()?.backgroundColor === color"
          [class.ring-offset-2]="board()?.backgroundColor === color"
          [class.ring-offset-[#12141a]]="board()?.backgroundColor === color"
          [class.ring-white]="board()?.backgroundColor === color"
        ></button>
        }
      </div>
    </div>

    <div class="my-2 border-t border-gray-700"></div>

    <div class="px-4 py-2">
      <button
        (click)="requestDeleteBoard()"
        class="w-full cursor-pointer text-left px-3 py-2 text-sm text-red-400 hover:bg-red-800/30 rounded transition-colors flex items-center gap-2 group"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-4 h-4 group-hover:scale-110 transition-transform"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"
          />
        </svg>
        Eliminar tablero
      </button>
    </div>
  </div>
  }
</div>
<app-confirm-modal
  [title]="modalTitle()"
  [message]="modalMessage()"
  (onConfirm)="onDeleteConfirm()"
>
</app-confirm-modal>
