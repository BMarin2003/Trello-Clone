<div>
  <h2 class="text-xl font-bold text-gray-100 mb-5">Mis Tableros</h2>

  @if (isLoading()) {
  <div class="flex items-center gap-2 text-gray-400 animate-pulse">
    <div
      class="w-5 h-5 border-2 border-violet-500 border-t-transparent rounded-full animate-spin"
    ></div>
    <span>Cargando tus proyectos...</span>
  </div>
  }

  <div
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"
  >
    @for (board of boards(); track board.id) {
    <div
      [routerLink]="['/boards', board.id]"
      class="group relative h-28 rounded-xl p-4 cursor-pointer hover:shadow-xl hover:scale-[1.02] transition-all duration-200 overflow-hidden"
      [ngClass]="getBgColor(board.backgroundColor)"
    >
      <div
        class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors"
      ></div>
      <h3 class="font-bold text-white text-base relative z-10 drop-shadow-sm">
        {{ board.title }}
      </h3>
      <div class="absolute bottom-3 right-3 text-white/70 text-xs font-medium">
        {{ board.columns?.length || 0 }} listas
      </div>
    </div>
    }

    <button
      (click)="openCreateModal()"
      class="h-28 bg-white/5 rounded-xl border border-white/10 flex flex-col items-center justify-center text-gray-400 hover:bg-white/10 hover:text-gray-200 hover:border-white/20 transition-all gap-1.5 cursor-pointer"
    >
      <span class="text-2xl font-light">+</span>
      <span class="font-medium text-sm">Crear nuevo tablero</span>
    </button>
  </div>

  @if (isCreateModalOpen()) {
  <app-create-board-modal
    (close)="closeCreateModal()"
    (confirm)="createBoardHandler($event)"
  >
  </app-create-board-modal>
  }
</div>
