<div class="h-dvh w-full flex bg-[#1b2838]">
  <aside
    class="bg-[#171a21] flex flex-col transition-all duration-300 ease-in-out shrink-0"
    [class.w-56]="!isCollapsed()"
    [class.w-14]="isCollapsed()"
  >
    <div class="h-12 flex items-center px-3 border-b border-white/10">
      <div class="flex items-center gap-2.5 overflow-hidden">
        <div
          class="w-7 h-7 bg-gradient-to-br from-violet-500 to-purple-600 rounded-lg flex items-center justify-center text-white font-bold text-xs shrink-0 shadow-md"
        >
          T
        </div>
        <span
          class="font-semibold text-gray-100 text-sm whitespace-nowrap transition-opacity duration-200"
          [class.opacity-0]="isCollapsed()"
          [class.invisible]="isCollapsed()"
          >TrelloClone</span
        >
      </div>
    </div>

    <nav class="flex-1 py-3 overflow-y-auto">
      <ul class="space-y-1 px-2">
        <li>
          <a
            routerLink="/boards"
            class="flex items-center gap-3 px-2.5 py-2 text-gray-300 rounded-lg hover:bg-white/10 hover:text-white transition-colors cursor-pointer group"
            [class.justify-center]="isCollapsed()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5 text-gray-400 group-hover:text-violet-400 shrink-0 transition-colors"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"
              />
            </svg>
            <span
              class="font-medium text-sm whitespace-nowrap transition-opacity duration-200"
              [class.opacity-0]="isCollapsed()"
              [class.hidden]="isCollapsed()"
              >Mis Tableros</span
            >
          </a>
        </li>
        <li>
          <a
            routerLink="/settings"
            class="flex items-center gap-3 px-2.5 py-2 text-gray-300 rounded-lg hover:bg-white/10 hover:text-white transition-colors cursor-pointer group"
            [class.justify-center]="isCollapsed()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5 text-gray-400 group-hover:text-violet-400 shrink-0 transition-colors"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
            <span
              class="font-medium text-sm whitespace-nowrap transition-opacity duration-200"
              [class.opacity-0]="isCollapsed()"
              [class.hidden]="isCollapsed()"
              >Configuración</span
            >
          </a>
        </li>
      </ul>
    </nav>

    <div class="p-2 border-t border-white/10">
      <button
        (click)="toggleSidebar()"
        class="w-full flex items-center justify-center p-2 text-gray-400 hover:bg-white/10 hover:text-white rounded-lg transition-colors cursor-pointer"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5 transition-transform duration-300"
          [class.rotate-180]="isCollapsed()"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M11 19l-7-7 7-7m8 14l-7-7 7-7"
          />
        </svg>
      </button>
    </div>

    <div class="p-2 border-t border-white/10">
      <button
        class="w-full flex items-center gap-2 px-2.5 py-2 text-sm font-medium text-red-400 hover:bg-red-500/20 hover:text-red-300 rounded-lg transition-colors cursor-pointer"
        [class.justify-center]="isCollapsed()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5 shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          />
        </svg>
        <span
          class="whitespace-nowrap transition-opacity duration-200"
          [class.opacity-0]="isCollapsed()"
          [class.hidden]="isCollapsed()"
          >Cerrar Sesión</span
        >
      </button>
    </div>
  </aside>

  <main class="flex-1 flex flex-col h-full overflow-hidden">
    <header
      class="h-12 flex items-center justify-between px-5 bg-[#171a21] shrink-0"
    >
      <h1 class="text-base font-semibold text-gray-100">Panel Principal</h1>
      <div
        class="w-8 h-8 rounded-full bg-gradient-to-br from-violet-500 to-purple-600 flex items-center justify-center text-white font-bold text-xs shadow-md cursor-pointer hover:shadow-lg transition-shadow"
      >
        U
      </div>
    </header>

    <div class="flex-1 overflow-auto p-5 bg-[#1b2838]">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
